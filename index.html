<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tubrax | CheckList de Processo Produção Nacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
     <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuração Dinâmica do Firebase
        const config = {
            apiKey: "", 
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        const firebaseConfig = config.apiKey ? config : JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const finalAppId = typeof __app_id !== 'undefined' ? __app_id : 'tubrax-producao-nacional';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Exporta para o escopo global de forma segura
        window.db = db;
        window.auth = auth;
        window.appId = finalAppId;
        window.firestoreUtils = { doc, setDoc, serverTimestamp };

        // Promessa de Autenticação para garantir que as gravações esperem o login
        window.authPromise = (async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const userCredential = await signInWithCustomToken(auth, __initial_auth_token);
                    console.log("Conectado via Token Grupo TBX");
                    return userCredential.user;
                } else {
                    const userCredential = await signInAnonymously(auth);
                    console.log("Conectado Anônimo Grupo TBX");
                    return userCredential.user;
                }
            } catch (error) {
                console.error("Erro crítico de autenticação:", error);
                return null;
            }
        })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        :root { --navy: #002147; --turquoise: #00CED1; --white: #FFFFFF; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .text-navy { color: var(--navy); }
        .bg-navy { background-color: var(--navy); }
        .text-turquoise { color: var(--turquoise); }
        .bg-turquoise { background-color: var(--turquoise); }
        .checkbox-custom:checked + span { text-decoration: line-through; color: #94a3b8; }
        .checkbox-custom:disabled { cursor: not-allowed; opacity: 0.3; }
        .progress-transition { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .image-preview { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; border: 2px solid var(--turquoise); }
        .card-accent { border-left: 5px solid var(--navy); }
        #success-modal { display: none; position: fixed; inset: 0; background: rgba(0, 33, 71, 0.8); z-index: 50; align-items: center; justify-content: center; padding: 1rem; }
        @media print { .no-print { display: none !important; } body { background: white; } }
    </style>
</head>
<body class="min-h-screen text-slate-900">

    <!-- Modal de Sucesso -->
    <div id="success-modal" class="no-print">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl border-t-8 border-turquoise">
            <div id="modal-loading" class="mb-4">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-navy mx-auto"></div>
                <p class="mt-2 text-xs font-bold text-navy uppercase tracking-widest">Sincronizando com Grupo TBX...</p>
            </div>
            <div id="modal-finished" class="hidden">
                <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <h3 class="text-xl font-black text-navy uppercase mb-2">Registro Concluído!</h3>
                <p class="text-slate-600 text-sm mb-6">O checklist de produção foi enviado com sucesso.</p>
                <button onclick="closeModal()" class="w-full py-3 bg-navy text-white font-bold rounded-lg hover:bg-slate-800 transition-all">VOLTAR</button>
            </div>
        </div>
    </div>

    <div class="h-2 bg-turquoise no-print"></div>

    <div class="max-w-3xl mx-auto px-4 py-8">
        <header class="bg-white rounded-xl shadow-lg p-6 mb-8 border border-slate-200">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div class="flex items-center gap-4">
                    <div class="bg-navy p-3 rounded-lg"><span class="text-white font-black text-xl italic">TUBRAX</span></div>
                    <div>
                        <h1 class="text-xl font-black text-navy uppercase tracking-widest leading-tight">CheckList de Processo<br><span class="text-turquoise">Produção Nacional</span></h1>
                        <p class="text-slate-500 text-xs font-bold mt-1" id="current-date"></p>
                    </div>
                </div>
                <div class="flex items-center gap-2 no-print">
                    <button onclick="resetChecklist()" class="px-4 py-2 text-[10px] font-black uppercase text-slate-400 hover:text-red-600 transition-colors">Limpar Tudo</button>
                    <button onclick="window.print()" class="px-5 py-2.5 text-[10px] font-black uppercase bg-navy text-white rounded shadow-md hover:bg-slate-800 transition-all">Gerar PDF</button>
                </div>
            </div>

            <div class="mt-8 p-5 bg-slate-50 rounded-xl border border-slate-200">
                <label for="operator-name" class="block text-[10px] font-black uppercase tracking-widest text-navy mb-2">Identificação do Operador</label>
                <input type="text" id="operator-name" placeholder="Digite seu nome completo" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-navy focus:outline-none focus:border-turquoise transition-all" oninput="saveOperatorName(this.value)">
            </div>

            <div class="mt-8 pt-6 border-t border-slate-100">
                <div class="flex justify-between items-end mb-3">
                    <span class="text-[10px] font-black uppercase text-slate-500 tracking-wider">Conclusão da Verificação</span>
                    <span class="text-lg font-black text-turquoise" id="progress-text">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                    <div id="progress-bar" class="bg-turquoise h-full progress-transition w-0"></div>
                </div>
            </div>
        </header>

        <div id="checklist-container" class="space-y-6"></div>

        <div class="mt-10 no-print">
            <button id="finish-btn" onclick="finishChecklist()" class="w-full py-5 bg-navy text-white text-sm font-black uppercase tracking-[0.2em] rounded-xl shadow-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Enviar
            </button>
            <p id="finish-error" class="text-center text-[10px] text-red-500 font-bold uppercase mt-4 hidden">Atenção: Informe o nome do operador e valide pelo menos um item com foto para enviar.</p>
        </div>

        <footer class="mt-12 text-center border-t border-slate-200 pt-8 pb-12">
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.5em]">Tubrax - Grupo TBX</p>
        </footer>
    </div>

    <script>
        const checklistData = [
            { 
                title: "📋 Itens de Verificação de Qualidade", 
                items: [
                    { id: "item_serrilhado", text: "Verificar se a chapa está com serrilhado" },
                    { id: "item_dobra", text: "Verificar se a dobra está fechando perfeitamente" },
                    { id: "item_solda", text: "Verificar se a solda está boa" },
                    { id: "item_lixa", text: "Verificar se a lixa flap está boa" },
                    { id: "item_limpeza", text: "Limpar o equipamento" }
                ] 
            }
        ];

        function initApp() {
            const options = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('pt-BR', options);
            const savedName = localStorage.getItem('operator_name');
            if (savedName) document.getElementById('operator-name').value = savedName;
            renderChecklist();
            updateProgress();
        }

        function saveOperatorName(name) {
            localStorage.setItem('operator_name', name);
            renderChecklist();
            updateProgress();
        }

        function renderChecklist() {
            const container = document.getElementById('checklist-container');
            const operatorName = localStorage.getItem('operator_name') || "";
            const isNameFilled = operatorName.trim().length >= 3;
            container.innerHTML = '';

            checklistData.forEach(section => {
                const sectionHtml = `
                    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden card-accent">
                        <div class="bg-navy px-6 py-4 flex justify-between items-center">
                            <h2 class="font-black text-white text-[10px] uppercase tracking-widest">${section.title}</h2>
                            <span class="text-turquoise text-[10px] font-black uppercase">Obrigatório Foto</span>
                        </div>
                        <div class="p-6 space-y-6">
                            ${section.items.map(item => {
                                const savedPhoto = localStorage.getItem(`photo_${item.id}`);
                                const isChecked = localStorage.getItem(item.id) === 'true';
                                const canCheck = savedPhoto && isNameFilled;
                                
                                return `
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                    <div class="flex items-start gap-4 flex-1">
                                        <div class="relative flex items-center h-6">
                                            <input type="checkbox" id="${item.id}" 
                                                class="checkbox-custom w-6 h-6 rounded border-slate-300 text-turquoise focus:ring-turquoise cursor-pointer transition-all" 
                                                onchange="handleCheck('${item.id}')" 
                                                ${isChecked ? 'checked' : ''} 
                                                ${!canCheck ? 'disabled' : ''}>
                                        </div>
                                        <div class="flex-1">
                                            <span class="text-sm font-bold text-navy block mb-2 transition-all ${isChecked ? 'opacity-40 line-through' : ''}">${item.text}</span>
                                            <div class="flex items-center gap-3 no-print">
                                                <label for="file_${item.id}" class="px-3 py-1.5 bg-slate-100 rounded text-[9px] font-black uppercase text-slate-600 cursor-pointer hover:bg-slate-200 transition-colors">
                                                    ${savedPhoto ? 'Alterar Evidência' : 'Anexar Evidência'}
                                                </label>
                                                <input type="file" id="file_${item.id}" accept="image/*" capture="environment" class="hidden" onchange="handleFileUpload(this, '${item.id}')">
                                                
                                                <span class="text-[8px] font-black uppercase tracking-widest ${!isNameFilled ? 'text-red-400' : !savedPhoto ? 'text-amber-500' : 'text-green-500'}">
                                                    ${!isNameFilled ? 'Insira o Nome' : !savedPhoto ? 'Falta Foto' : 'Validado'}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                    <div id="preview_container_${item.id}" class="${savedPhoto ? 'flex' : 'hidden'} justify-end">
                                        <img src="${savedPhoto || ''}" id="img_${item.id}" class="image-preview shadow-lg" alt="Evidência">
                                    </div>
                                </div><hr class="border-slate-50 last:hidden">`}).join('')}
                        </div>
                    </div>`;
                container.innerHTML += sectionHtml;
            });
        }

        async function handleFileUpload(input, id) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500; 
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const base64Data = canvas.toDataURL('image/jpeg', 0.7);
                    localStorage.setItem(`photo_${id}`, base64Data);
                    renderChecklist(); 
                    updateProgress();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleCheck(id) {
            localStorage.setItem(id, document.getElementById(id).checked);
            updateProgress();
            renderChecklist();
        }

        function updateProgress() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            const checked = document.querySelectorAll('input[type="checkbox"]:checked');
            const percentage = Math.round((checked.length / checkboxes.length) * 100) || 0;
            const bar = document.getElementById('progress-bar');
            if (bar) bar.style.width = percentage + '%';
            const text = document.getElementById('progress-text');
            if (text) text.innerText = percentage + '%';
            return { percentage, checkedCount: checked.length };
        }

        async function finishChecklist() {
            const { percentage, checkedCount } = updateProgress();
            const operatorName = (localStorage.getItem('operator_name') || "").trim();
            
            if (checkedCount > 0 && operatorName.length >= 3) {
                // Abre modal e inicia carregamento
                document.getElementById('finish-error').classList.add('hidden');
                document.getElementById('success-modal').style.display = 'flex';
                document.getElementById('modal-loading').classList.remove('hidden');
                document.getElementById('modal-finished').classList.add('hidden');

                // AGUARDA AUTENTICAÇÃO ANTES DE QUALQUER OPERAÇÃO DE BANCO
                const user = await window.authPromise;
                if (!user) {
                    console.error("Falha na autenticação silenciosa.");
                    document.getElementById('modal-loading').classList.add('hidden');
                    alert("Erro de conexão com o servidor. Tente novamente em instantes.");
                    closeModal();
                    return;
                }

                const submissionId = `sub_nacional_${Date.now()}`;
                const payload = {
                    operator: operatorName,
                    type: "Produção Nacional",
                    completion: `${percentage}%`,
                    timestamp: window.firestoreUtils.serverTimestamp(),
                    items: {}
                };
                
                checklistData.forEach(section => {
                    section.items.forEach(item => {
                        const isChecked = localStorage.getItem(item.id) === 'true';
                        if (isChecked) {
                            payload.items[item.id] = {
                                text: item.text,
                                photo: localStorage.getItem(`photo_${item.id}`),
                                status: "Verificado"
                            };
                        }
                    });
                });

                try {
                    const { doc, setDoc } = window.firestoreUtils;
                    // Caminho obrigatório: artifacts/{appId}/public/data/{collection}/{docId}
                    await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'submissions', submissionId), payload);
                    
                    document.getElementById('modal-loading').classList.add('hidden');
                    document.getElementById('modal-finished').classList.remove('hidden');
                } catch (e) {
                    console.error("Erro ao salvar no Firestore:", e);
                    // Fallback visual amigável em caso de falha de permissão residual
                    document.getElementById('modal-loading').classList.add('hidden');
                    alert("Erro de permissão no servidor. Verifique se o projeto está configurado corretamente.");
                    closeModal();
                }
            } else {
                document.getElementById('finish-error').classList.remove('hidden');
                document.getElementById('finish-error').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function closeModal() { document.getElementById('success-modal').style.display = 'none'; }
        
        function resetChecklist() { 
            if (confirm("Deseja realmente limpar todos os campos e fotos deste checklist?")) { 
                localStorage.clear(); 
                location.reload(); 
            } 
        }

        window.onload = initApp;
    </script>
</body>
</html>
